[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "satchel"
version = "0.1.0"
description = "Lossless media packaging as standard zip archives (FLAC for PCM audio, bit-exact restore)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = ["cffi>=1.15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["satchel"]

[tool.setuptools.package-data]
satchel = ["_cdef.h", "*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
