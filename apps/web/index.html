<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Satchel</title>
    <script src="coi-serviceworker.js"></script>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.mjs"></script>
</head>
<body>
    <header>
        <h1>Satchel</h1>
        <p class="tagline">Open zip archives and restore the original audio, or pack files losslessly. Everything runs in your browser; nothing is uploaded.</p>
    </header>

    <div id="fatal" class="banner error" hidden></div>

    <main>
        <section id="open-card" class="card">
            <h2>Open an archive</h2>
            <label class="drop" id="open-drop">
                <input type="file" id="open-input" accept=".zip,application/zip">
                <span>Drop a .zip here or <u>choose one</u></span>
            </label>
            <div id="archive" hidden>
                <p id="archive-summary" class="summary"></p>
                <div class="options">
                    <label><input type="checkbox" id="opt-restore" checked> Restore original audio</label>
                    <label><input type="checkbox" id="opt-readme"> Include the generated readme</label>
                </div>
                <div class="actions">
                    <button id="extract" class="primary">Extract all</button>
                    <button id="verify">Verify</button>
                </div>
                <div class="table-wrap"><table id="entries"><thead><tr><th>Name</th><th>Size</th><th>Packed</th><th>Method</th><th>Restores to</th></tr></thead><tbody></tbody></table></div>
            </div>
        </section>

        <section id="create-card" class="card">
            <h2>Create an archive</h2>
            <label class="drop" id="create-drop">
                <input type="file" id="create-input" multiple>
                <span>Drop files or folders here or <u>choose files</u></span>
            </label>
            <label class="link"><input type="file" id="create-folder" webkitdirectory> choose a folder</label>
            <div id="plan" hidden>
                <p id="plan-summary" class="summary"></p>
                <div id="issues"></div>
                <div class="options">
                    <label><input type="checkbox" id="opt-flac" checked> Convert PCM audio to FLAC</label>
                    <label>Archive name <input type="text" id="archive-name" value="archive.zip"></label>
                </div>
                <div class="actions"><button id="build" class="primary">Create archive</button></div>
                <div class="table-wrap"><table id="plan-entries"><thead><tr><th>Name</th><th>Size</th><th>Method</th><th>Restores to</th></tr></thead><tbody></tbody></table></div>
            </div>
        </section>
    </main>

    <div id="job" class="job" hidden>
        <div class="job-label" id="job-label"></div>
        <progress id="job-progress" max="1" value="0"></progress>
        <div class="job-detail" id="job-detail"></div>
    </div>
    <div id="result" class="banner" hidden></div>

    <footer>
        <span id="version"></span> ·
        Free software under the <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a> —
        <a href="https://github.com/claude-coder-collab/satchel">source code</a>
    </footer>
</body>
</html>
