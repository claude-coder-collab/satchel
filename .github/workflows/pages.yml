name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the browser app
        run: |
          emcmake cmake --preset wasm -DZP_BUILD_TESTS=OFF
          cmake --build build/wasm --config Release --target satchel_web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wasm/web
      - id: deployment
        uses: actions/deploy-pages@v4
